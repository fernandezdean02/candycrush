<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Card Scatter Slot — Realistic Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg: #0b0f14;
    --panel: rgba(20,20,20,0.9);
    --glass: rgba(255,255,255,0.08);
    --accent: #ffb703;
    --green: #28a745;
    --red: #e11d48;
    --card: #1d1f2a;
    --shadow: rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    background: radial-gradient(circle at 20% -10%, rgba(255, 140, 0, 0.15), transparent 40%),
                radial-gradient(circle at 100% 0%, rgba(0, 255, 255, 0.08), transparent 40%),
                linear-gradient(#0b0f14, #0b0f14);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .slot {
    width: min(980px, 96vw);
    background: linear-gradient(#141a1f, #0a0f14);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 40px var(--shadow);
    border: 1px solid rgba(255,255,255,0.08);
    position: relative;
    overflow: hidden;
  }

  /* Decorative chrome frame */
  .slot-frame {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: 
      linear-gradient(to bottom, rgba(255,255,255,0.06), rgba(0,0,0,0.0) 60%),
      radial-gradient(circle at 50% -10%, rgba(255,255,255,0.25), transparent 40%);
    mix-blend-mode: overlay;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand .logo {
    width: 40px; height: 40px; border-radius: 8px;
    background: linear-gradient(135deg, #1e1f2a, #0b0f14);
    display: grid; place-items: center;
    box-shadow: inset 0 0 8px rgba(255,255,255,0.15);
  }

  .brand h1 { font-size: 14px; margin: 0; letter-spacing: .4px; }

  .panel {
    background: var(--panel);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid rgba(255,255,255,0.08);
  }

  .bet-controls {
    display: flex; align-items: center; gap: 8px;
  }
  .btn {
    background: #1e293b;
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .1s ease;
  }
  .btn:active { transform: translateY(1px) scale(0.98); }
  .btn.primary {
    background: linear-gradient(135deg, #e50914, #b90f0f);
    border: none;
    box-shadow: 0 4px 16px rgba(229,9,20,0.6);
  }
  .btn.ghost { background: transparent; border-color: rgba(255,255,255,0.25); }

  .reels {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    padding: 14px;
  }

  .reel {
    height: 170px;
    background: linear-gradient(#2a2f3a, #1b1f2c);
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.14);
    position: relative;
    overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }

  /* window glass look */
  .reel-screen {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(8,12,18,0.9), rgba(8,12,18,0.6) 60%, rgba(8,12,18,0.9));
    border-radius: 12px;
    padding: 8px;
    display: grid;
    grid-template-rows: repeat(3, 1fr);
    align-items: stretch;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    align-items: center;
  }

  .cell {
    height: 48px;
    margin: 6px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
    background: linear-gradient(#2b2f3a, #1a1e2a);
    border: 1px solid rgba(255,255,255,0.15);
  }

  /* glass highlight sweep */
  .reel::before {
    content:'';
    position:absolute; top:0; left:0; right:0; height:100%;
    background: linear-gradient( to bottom, rgba(255,255,255,0.08), rgba(255,255,255,0) 30%, rgba(255,255,255,0.08) 70%, rgba(255,255,255,0) 100%);
    mix-blend-mode: overlay;
    pointer-events: none;
    transform: translateY(-100%);
  }

  .frame-glow {
    position: absolute;
    left: -6px; right: -6px; top: -6px; bottom: -6px;
    border-radius: 14px;
    pointer-events: none;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,.2), transparent 40%);
    filter: blur(4px);
  }

  .spin-area {
    display:flex; justify-content:center; align-items:center;
    padding: 8px;
  }

  .spin-btn {
    width: 72px; height: 72px; border-radius: 50%;
    border: none; cursor: pointer;
    background: radial-gradient(circle at 30% 30%, #fff, #ddd 40%, #bbb 60%, #999 100%);
    display: grid; place-items: center;
    box-shadow: 0 8px 18px rgba(0,0,0,.6);
  }
  .spin-btn:active {
    transform: scale(0.98);
  }

  /* enhanced symbol look (card faces) */
  .symbol {
    font-family: "Segoe UI Symbol", "Arial Unicode MS", sans-serif;
    font-size: 28px;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.5));
  }

  .paytable {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 8px;
    font-size: 12px;
    opacity: .95;
  }

  .credit {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 860px){
    .reels { grid-template-columns: 1fr; gap: 12px; }
    .reel { height: 150px; }
  }

  /* subtle win glow */
  .win {
    animation: glow 0.6s ease-out;
  }
  @keyframes glow {
    0% { box-shadow: 0 0 0 rgba(0,0,0,0); }
    40% { box-shadow: 0 0 20px rgba(40,200,100,.8); }
    100% { box-shadow: 0 0 0 rgba(0,0,0,0); }
  }
</style>
</head>
<body>
<div class="slot" aria-label="Card Scatter Slot">
  <div class="slot-frame" aria-hidden="true"></div>

  <header>
    <div class="brand">
      <div class="logo" aria-label="Brand badge">
        <!-- tiny SVG badge -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1b1f2a" stroke-width="2">
          <path d="M12 3l3 6 6 1-4.5 4.5 1 6-5.5-2.9L6 20l1-6L3 10l6-1 3-6z" fill="#e50914" stroke="none"/>
        </svg>
      </div>
      <h1 style="margin:0;font-size:14px;letter-spacing:.4px">Card Scatter Deluxe</h1>
    </div>
    <div class="panel" aria-label="Credit and bets">
      <span>Bet per line</span>
      <div class="bet-controls" role="group" aria-label="Bet controls">
        <button class="btn" id="bet-1">1</button>
        <button class="btn" id="bet-2">2</button>
        <button class="btn" id="bet-3">3</button>
      </div>
      <span class="credit" id="credit">Credits: 1000</span>
    </div>
  </header>

  <section class="reels" id="reels" aria-label="Slot reels">
    <!-- 3 reels, each 3x height area (for a 3x3 feel) -->
    <div class="reel" data-index="0" aria-label="Reel 1">
      <div class="reel-screen" id="r0">
        <div class="row"><div class="cell symbol">♠</div><div class="cell symbol">♥</div><div class="cell symbol">♦</div></div>
        <div class="row"><div class="cell symbol">♣</div><div class="cell symbol">🂠</div><div class="cell symbol">🂡</div></div>
        <div class="row"><div class="cell symbol">♠</div><div class="cell symbol">♥</div><div class="cell symbol">♦</div></div>
      </div>
    </div>

    <div class="reel" data-index="1" aria-label="Reel 2">
      <div class="reel-screen" id="r1">
        <div class="row"><div class="cell symbol">♦</div><div class="cell symbol">♠</div><div class="cell symbol">♣</div></div>
        <div class="row"><div class="cell symbol">🂡</div><div class="cell symbol">🂠</div><div class="cell symbol">♥</div></div>
        <div class="row"><div class="cell symbol">♦</div><div class="cell symbol">♣</div><div class="cell symbol">♠</div></div>
      </div>
    </div>

    <div class="reel" data-index="2" aria-label="Reel 3">
      <div class="reel-screen" id="r2">
        <div class="row"><div class="cell symbol">♥</div><div class="cell symbol">♠</div><div class="cell symbol">♦</div></div>
        <div class="row"><div class="cell symbol">♣</div><div class="cell symbol">🂡</div><div class="cell symbol">🂠</div></div>
        <div class="row"><div class="cell symbol">♥</div><div class="cell symbol">♠</div><div class="cell symbol">♦</div></div>
      </div>
    </div>
  </section>

  <div class="spin-area">
    <button class="spin-btn" id="spin" aria-label="Spin">
      <!-- lightweight SVG spinner -->
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,0.5)"/>
        <path d="M21 12a9 9 0 0 1-9 9" stroke="white"/>
      </svg>
    </button>
  </div>

  <div id="msg" style="text-align:center; font-size:14px; margin-top:6px; min-height:20px;"></div>

  <section aria-label="Payouts" style="margin-top:14px;">
    <div class="paytable" style="gap:12px;">
      <div>Three match (any symbol)</div><div id="p3" style="text-align:right;">0x</div>
      <div>Two matches + Wild</div><div id="p2" style="text-align:right;">0x</div>
      <div>One match</div><div id="p1" style="text-align:right;">0x</div>
    </div>
  </section>
</div>

<script>
  // Core data
  const symbols = ['♠','♥','♦','♣','🂠','🂡'];
  const reels = [
    document.querySelector('#r0'),
    document.querySelector('#r1'),
    document.querySelector('#r2')
  ];
  const betDisplay = document.getElementById('credit');
  const msg = document.getElementById('msg');
  const spinBtn = document.getElementById('spin');
  const bets = [1,2,3];
  let currentBet = 1;
  let credits = 1000;
  let spinning = false;

  // Paytable (simplified)
  function updatePaytable(matches){
    const [a,b,c] = matches;
    const isThree = a===b && b===c;
    const isTwo = new Set(matches).size === 2; // any two same
    const pay3 = 5; // payout multiplier for three of a kind
    const pay2 = 1; // two of a kind
    const pay1 = 0; // no win otherwise
    document.getElementById('p3').textContent = isThree ? (pay3 * currentBet) + 'x' : '0x';
    document.getElementById('p2').textContent = isTwo ? (pay2 * currentBet) + 'x' : '0x';
    document.getElementById('p1').textContent = (isThree || isTwo) ? (pay1) + '' : '0x';
  }

  // Spin logic: randomly pick symbol per reel and animate
  function spin(){
    if(spinning) return;
    if(credits <= 0){ msg.textContent = 'Out of credits.'; return; }
    spinning = true;
    msg.textContent = '';
    // simple 3x3 grid per reel: pick a target symbol per reel
    const targets = [
      symbols[Math.floor(Math.random()*symbols.length)],
      symbols[Math.floor(Math.random()*symbols.length)],
      symbols[Math.floor(Math.random()*symbols.length)]
    ];

    // Animate each reel with slight delay to feel realistic
    reels.forEach((panel, idx) => {
      const inner = panel.querySelector('.reel-screen');
      // Create a temporary vertical strip of symbols to simulate spin
      const strip = document.createElement('div');
      strip.style.display = 'grid';
      strip.style.gridTemplateRows = 'repeat(9, 1fr)';
      strip.style.height = '100%';
      strip.style.fontSize = '28px';
      strip.style.lineHeight = '1';
      strip.style.justifyItems = 'center';
      strip.style.alignItems = 'center';
      strip.style.color = '#fff';
      // Fill with random symbols
      for(let i=0;i<9;i++){
        const s = document.createElement('div');
        s.textContent = symbols[Math.floor(Math.random()*symbols.length)];
        s.style.height = '18px';
        strip.appendChild(s);
      }
      // overlay and animate
      inner.innerHTML = '';
      inner.appendChild(strip);

      // compute stop position so that target appears centered
      const stopIndex = Math.floor(Math.random()*9);
      const pos = stopIndex * 18; // approximate pixel step
      const duration = 900 + idx*180;

      strip.style.transition = `transform ${duration}ms cubic-bezier(.2,.9,.2,1)`;
      strip.style.transform = `translateY(-${pos}px)`;

      // after stop, reveal true target row
      setTimeout(()=>{
        // reset to 3x3 view with the target symbol centered
        inner.innerHTML = '';
        const row = document.createElement('div');
        row.style.display = 'grid';
        row.style.gridTemplateColumns = 'repeat(3, 1fr)';
        row.style.height = '100%';
        row.style.alignItems = 'center';
        row.style.justifyItems = 'center';
        // populate 3 cells with target symbol to show final state
        for(let j=0;j<3;j++){
          const cell = document.createElement('div');
          cell.className = 'cell symbol';
          cell.textContent = targets[idx];
          inner.appendChild(cell);
        }
        // mark as win candidate visually
        inner.parentElement.classList.add('win');
        setTimeout(()=>inner.parentElement.classList.remove('win'), 600);
        // if last reel finished, evaluate
        if(idx === reels.length - 1){
          setTimeout(()=>{
            evaluateWin(targets);
            spinning = false;
          }, 120);
        }
      }, duration);
    });
  }

  // Simple win evaluation
  function evaluateWin(targets){
    const [a,b,c] = targets;
    let win = 0;
    if(a===b && b===c){
      win =  currentBet * 5;
      credits += win;
      msg.textContent = 'Jackpot! +'+win+' credits';
      msg.style.color = '#4ade80';
    } else if (a===b || b===c || a===c){
      win = currentBet * 1;
      credits += win;
      msg.textContent = 'Nice! +'+win+' credits';
      msg.style.color = '#93c5fd';
    } else {
      credits -= currentBet;
      msg.textContent = 'No win. -'+currentBet;
      msg.style.color = '#f87171';
    }
    betDisplay.textContent = credits >= 0 ? `Credits: ${credits}` : `Credits: 0`;
    // update paytable
    updatePaytable([a,b,c]);
  }

  // Bet controls
  document.getElementById('bet-1').addEventListener('click', ()=>{ currentBet=1; updateCreditUI(); });
  document.getElementById('bet-2').addEventListener('click', ()=>{ currentBet=2; updateCreditUI(); });
  document.getElementById('bet-3').addEventListener('click', ()=>{ currentBet=3; updateCreditUI(); });

  function updateCreditUI(){
    betDisplay.textContent = credits >= 0 ? `Credits: ${credits}` : `Credits: 0`;
    // small visual cue
    msg.textContent = `Bet set to ${currentBet}x`;
  }

  spinBtn.addEventListener('click', spin);
  // init
  updateCreditUI();
  updatePaytable(['♠','♠','♠']); // default for initial paytable
</script>
</body>
</html>
